<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Car Price Predictor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container py-5"><div class="card p-4">
    <h1 class="mb-4">Car Price Predictor</h1>
    {% if prediction %}
        <div class="alert alert-success" role="alert">
            Predicted Price: <strong>{{ prediction }}</strong>
        </div>
    {% endif %}
    <form method="post" class="row g-3">
        <div class="col-md-4">
            <label class="form-label" for="model">Model</label>
            <select class="form-select" name="model" id="model" required>
                <option value="" disabled selected>Select model</option>
                {% for m in models %}
                    <option value="{{ m }}">{{ m }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-2">
            <label class="form-label" for="year">Year</label>
            <input type="number" class="form-control" name="year" id="year" required>
        </div>
        <div class="col-md-3">
            <label class="form-label" for="transmission">Transmission</label>
            <select class="form-select" name="transmission" id="transmission" required>
                <option value="" disabled selected>Select transmission</option>
                {% for t in transmissions %}
                    <option value="{{ t }}">{{ t }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label" for="fuel_type">Fuel Type</label>
            <select class="form-select" name="fuel_type" id="fuel_type" required>
                <option value="" disabled selected>Select fuel type</option>
                {% for f in fuel_types %}
                    <option value="{{ f }}">{{ f }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label" for="mileage">Mileage</label>
            <input type="number" class="form-control" name="mileage" id="mileage" required>
        </div>
        <div class="col-md-2">
            <label class="form-label" for="tax">Tax</label>
            <input type="number" class="form-control" name="tax" id="tax" required>
        </div>
        <div class="col-md-2">
            <label class="form-label" for="mpg">MPG</label>
            <input type="number" step="0.1" class="form-control" name="mpg" id="mpg" required>
        </div>
        <div class="col-md-2">
            <label class="form-label" for="engine_size">Engine Size</label>
            <input type="number" step="0.1" class="form-control" name="engine_size" id="engine_size" required>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Predict Price</button>
        </div>
    </form>
</div>
</div>
</body>
</html>
